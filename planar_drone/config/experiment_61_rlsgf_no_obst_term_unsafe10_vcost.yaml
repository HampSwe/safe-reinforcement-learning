# experiment_61 = experiment_58 (RL-SGF, no obstacle termination, cumulative per-step r1 charged per unit path
# length, unsafe_speed_ref 4.0) with runner.unsafe_cost 30 -> 10 (2026-09-24). exp58 at c = 30: reward identical to
# exp16 (132 at 6000) but hits 14 % (exp16: 3.8 %) with V1 stuck at +19..+29 and u ~0.03-0.12 all run -- |g1| ~300
# made A = |g1|^2 - 2 alpha V1 ~ 1e5, so the QCQP bought the demanded descent alpha h V1 ~ 0.05 with a negligible u
# and the linear model never delivered it. c = 10 keeps every crossing episode V1-positive (99.5 % on the exp16
# policy; mean V1 = 0 at ~15 % hits) with a 3x smaller |g1| / V1 than at 30.
# r1 inside the 1.3 r disc = 10 * |v| / 4 m/s. Everything else identical to experiment_58 / experiment_16.
runner:
  num_steps_per_env: 0
  num_steps_per_env_multiplier: 1
  reset_after_update: true
  terminate_on_obstacle: false
  unsafe_cost: 10.0        # r1 inside the unsafe set (exp58: 30, exp16: 0.95); see header
  unsafe_speed_ref: 4.0    # ... charged per unit path length: 10 * |v| / 4 m/s
  obs_groups: {"actor": ["policy"], "critic": ["policy", "privileged"]}
  save_interval: 100
  algorithm:
    class_name: rsl_rl.algorithms.rl_sgf:RLSGF
    bootstrap_final_state: false
    critic_use_epochs: true
    critic_epochs: 3
    critic_minibatch: 131072
  actor:
    class_name: MLPModel
    distribution_cfg:
      class_name: GaussianDistribution
      std_type: log
      init_std: 1.0
      std_range: [0.2, 2.0]
  critic:
    class_name: MLPModel
