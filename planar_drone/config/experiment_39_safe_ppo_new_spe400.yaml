# experiment_39 = experiment_38 with num_steps_per_env 400 (= T, one update per full episode length, as RL-SGF) and
# 4000 iterations: identical env-step budget (4000 x 400), 4x fewer policy updates. Per update the QCQP demands the
# same contraction alpha h |V1|, so in env-step terms the constraint is 4x weaker than in exp38; PPO does 5 epochs x 4
# minibatches over a 4x larger buffer. Curriculum is pinned to 400 env steps in both. With spe = T nearly every env
# starts one episode per window (V1 start rows ~ 2048 instead of ~600-900) and fewer rows need the critic bootstrap.
# experiment_38 = "new SafePPO" (2026-09-22): experiment_34 (per-episode r1, credit at start, V1 from episode-start
# rows, grad V1 per episode) + FIXED curvature constant kappa = L h = 0.25 (kappa_calibrate false; L ~ 4-6 measured by
# the online regression in exp35 once past the initial transient; the legacy closed form assumes L = 1/h = 20)
# + the split-half |grad V1|^2 (<g1_a, g1_b> from the two env halves, unbiased, replaces the noise-inflated
# |g1_hat|^2 in A / Delta / |g1 - g0|^2; the step direction still uses the full-batch g1_hat).
# Budget: 16000 x 100 = 4000 x 400 env steps ("4000 RL-SGF iterations"); the spe = 400 counterpart is experiment_39.
runner:
  num_steps_per_env: 400
  curriculum_steps_per_env: 400
  subtract_r1_from_r0: false
  terminate_on_obstacle: false
  r1_mode: episode
  r1_credit: start
  collision_budget: 0.05
  obs_groups: {"actor": ["policy"], "critic": ["policy", "privileged"]}
  save_interval: 500
  algorithm:
    class_name: rsl_rl.algorithms.safe_ppo:SafePPO
    # --- PPO task channel ---
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.005
    learning_rate: 0.0001
    max_grad_norm: 1.0
    use_clipped_value_loss: true
    schedule: adaptive
    desired_kl: 0.01
    normalize_advantage_per_mini_batch: false
    # --- safe gradient flow (Lemma-3 QCQP) ---
    h: 0.05
    alpha: 1.0
    eps: 1.0e-08
    gamma1: 1.0
    h_schedule: false
    h_exp: 2.0
    h_min: 1.0e-07
    # --- safety channel ---
    r1_scale: 1.0
    dir_scale: 1.0
    grad_v1_divide_by_T: true   # ignored with grad_v1_denom: episode
    grad_v1_denom: episode
    v1_estimate: start
    split_half_norm: true
    kappa_calibrate: false
    kappa_fixed: 0.25
    kappa_warmup: 300
    kappa_cal_skip: 100
    kappa_ema: 0.995
    kappa_min: 0.01
    kappa_max: 100.0
    bootstrap_cost_returns: true
    project_std: false
    # --- cost critic (V1 baseline) ---
    cost_critic_lr: 0.0003
    cost_critic_epochs: 4
    cost_critic_mini_batches: 4
    cost_critic_max_grad_norm: 3.0
    # --- trust region on the projected step ---
    kl_budget: 0.08
    kl_backoff_steps: 5
    memory_chunk_size: 50
  actor:
    class_name: MLPModel
    distribution_cfg:
      class_name: GaussianDistribution
      std_type: log
      init_std: 1.0
      std_range: [0.2, 2.0]
  critic:
    class_name: MLPModel
