# experiment_65 = experiment_64 (SafePPO z 120, h_ref 0.008, cumulative per-step r1 at c = 0.95, split-half, KL halving
# off, max_theta_step 0.5, project_std true, kappa 1, grad_v1_denom episode, y = 1) with the PPO learning-rate schedule
# switched fixed 3e-4 -> adaptive from the rsl-rl default 1e-3 (2026-09-24). exp64 (logs/exp62): reward 51.5 at it 1600-2000 fell to a flat ~43 once the
# curriculum hit difficulty 1 (it ~2200); by it 4800 std 0.22 pinned h at 3.2e-4, task_gain 0.039, step 0.004, so the
# task channel had died while hits held 2.5 %. Adaptive lr re-scales dtheta_ppo (and so |g0| = z |dtheta_ppo|) by KL.
runner:
  num_steps_per_env: 100
  curriculum_steps_per_env: 400
  subtract_r1_from_r0: false
  terminate_on_obstacle: false
  r1_mode: step
  obs_groups: {"actor": ["policy"], "critic": ["policy", "privileged"]}
  save_interval: 500
  algorithm:
    class_name: rsl_rl.algorithms.safe_ppo:SafePPO
    # --- PPO task channel ---
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.005
    learning_rate: 1.0e-03   # exp65: rsl-rl default start for the adaptive schedule (exp64: fixed 3e-4)
    max_grad_norm: 1.0
    use_clipped_value_loss: true
    schedule: adaptive   # exp65: PPO adaptive lr on (desired_kl 0.01, lr x/1.5), exp64: fixed 3e-4
    desired_kl: 0.01
    normalize_advantage_per_mini_batch: false
    # --- safe gradient flow (Lemma-3 QCQP) ---
    h: 0.008   # h_ref (exp54: 0.005); task_gain = h z starts at 0.96
    z: 120.0   # exp54: 200; |g0| = z |dtheta_ppo|
    alpha: 1.0
    eps: 1.0e-08
    gamma1: 0.99
    h_schedule: true
    h_exp: 2.0
    h_min: 1.0e-07
    # --- safety channel ---
    r1_scale: 1.0
    dir_scale: 1.0
    grad_v1_divide_by_T: true   # ignored with grad_v1_denom: episode
    grad_v1_denom: episode
    v1_estimate: start
    split_half_norm: true
    kappa_calibrate: false
    kappa_fixed: 1.0   # paper L = 1/h
    kappa_warmup: 300
    kappa_cal_skip: 100
    kappa_ema: 0.995
    kappa_min: 0.01
    kappa_max: 100.0
    bootstrap_cost_returns: true
    project_std: true   # std block under the QCQP + h z scaling (rl_sgf.py parity)
    # --- cost critic (V1 baseline) ---
    cost_critic_lr: 0.0003
    cost_critic_epochs: 4
    cost_critic_mini_batches: 4
    cost_critic_max_grad_norm: 3.0
    # --- trust region on the projected step ---
    kl_budget: 0.08
    kl_backoff_steps: 1   # halving off
    max_theta_step: 0.5   # L2 clip on the whole applied step (rl_sgf.py parity), replaces the halving
    memory_chunk_size: 50
  actor:
    class_name: MLPModel
    distribution_cfg:
      class_name: GaussianDistribution
      std_type: log
      init_std: 1.0
      std_range: [0.2, 2.0]
  critic:
    class_name: MLPModel
