# RL-SGF on the NO-OBSTACLE-TERMINATION task (experiment_16) with the r1 penalty inside the unsafe set raised
# from 1 - beta = 0.95 to 30 (runner.unsafe_cost, 2026-09-19; 10 was tried first: same 3.5 % collision floor, reward stuck at ~73). Motivation: without termination RL-SGF plateaued
# at ~3.7 % episodes with contact (vs ~2 % with termination) -- a brief pass through the disc was cheap enough
# for V1 <= 0 to hold. Everything else identical to experiment_16. Collision rate: Episode/ep_hit_obstacle.
runner:
  num_steps_per_env: 0
  num_steps_per_env_multiplier: 1
  reset_after_update: true
  terminate_on_obstacle: false
  unsafe_cost: 30.0
  obs_groups: {"actor": ["policy"], "critic": ["policy", "privileged"]}
  save_interval: 100
  algorithm:
    class_name: rsl_rl.algorithms.rl_sgf:RLSGF
    bootstrap_final_state: false
    critic_use_epochs: true
    critic_epochs: 3
    critic_minibatch: 131072
  actor:
    class_name: MLPModel
    distribution_cfg:
      class_name: GaussianDistribution
      std_type: log
      init_std: 1.0
      std_range: [0.2, 2.0]
  critic:
    class_name: MLPModel
