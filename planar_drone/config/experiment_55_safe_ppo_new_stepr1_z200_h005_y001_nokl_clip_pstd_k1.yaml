# experiment_55 = experiment_54 (z 200, h_ref 0.005, sigma h schedule on, cumulative per-step r1, split-half, fixed PPO lr
# 3e-4, KL halving off, max_theta_step 0.5, project_std true, kappa 1) with a factor y = 0.01 in front of g1
# (algorithm.dir_scale, 2026-09-24): g1 -> y g1 in the QCQP (both split halves, so |g1|^2 -> y^2 |g1|^2; V1 untouched).
# exp54 was stable and safe (hits 2.5-3 %, KL ~0.002, clip never) but the reward stalled at ~48-50 from it ~500 with
# u 4-6 every iteration, i.e. the task channel got ~1/(1+u) ~ 17 % of the step (RL-SGF: u ~ 2, reward 77 at the same
# env steps). Shrinking g1 makes the constraint g1.d + (L/2)|d|^2 <= -alpha h V1 nearly a pure norm bound while V1 is
# slack, so u should drop toward 0 and the task step get through until V1 approaches 0.
runner:
  num_steps_per_env: 100
  curriculum_steps_per_env: 400
  subtract_r1_from_r0: false
  terminate_on_obstacle: false
  r1_mode: step
  obs_groups: {"actor": ["policy"], "critic": ["policy", "privileged"]}
  save_interval: 500
  algorithm:
    class_name: rsl_rl.algorithms.safe_ppo:SafePPO
    # --- PPO task channel ---
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.005
    learning_rate: 3.0e-04
    max_grad_norm: 1.0
    use_clipped_value_loss: true
    schedule: fixed
    desired_kl: 0.01
    normalize_advantage_per_mini_batch: false
    # --- safe gradient flow (Lemma-3 QCQP) ---
    h: 0.005   # h_ref; task_gain = h z starts at 1
    z: 200.0   # 10x exp52; |g0| = z |dtheta_ppo| on RL-SGF scale
    alpha: 1.0
    eps: 1.0e-08
    gamma1: 0.99
    h_schedule: true
    h_exp: 2.0
    h_min: 1.0e-07
    # --- safety channel ---
    r1_scale: 1.0
    dir_scale: 0.01   # y: factor in front of g1
    grad_v1_divide_by_T: true   # ignored with grad_v1_denom: episode
    grad_v1_denom: episode
    v1_estimate: start
    split_half_norm: true
    kappa_calibrate: false
    kappa_fixed: 1.0   # paper L = 1/h
    kappa_warmup: 300
    kappa_cal_skip: 100
    kappa_ema: 0.995
    kappa_min: 0.01
    kappa_max: 100.0
    bootstrap_cost_returns: true
    project_std: true   # std block under the QCQP + h z scaling (rl_sgf.py parity)
    # --- cost critic (V1 baseline) ---
    cost_critic_lr: 0.0003
    cost_critic_epochs: 4
    cost_critic_mini_batches: 4
    cost_critic_max_grad_norm: 3.0
    # --- trust region on the projected step ---
    kl_budget: 0.08
    kl_backoff_steps: 1   # halving off
    max_theta_step: 0.5   # L2 clip on the whole applied step (rl_sgf.py parity), replaces the halving
    memory_chunk_size: 50
  actor:
    class_name: MLPModel
    distribution_cfg:
      class_name: GaussianDistribution
      std_type: log
      init_std: 1.0
      std_range: [0.2, 2.0]
  critic:
    class_name: MLPModel
